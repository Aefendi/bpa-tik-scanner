
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Scanner QR BPA TIK</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      color: #263445;
    }

    .container {
      max-width: 650px;
      margin: auto;
    }

    .header {
      background: #174ea6;
      color: white;
      padding: 22px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    select, button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border-radius: 7px;
      border: 1px solid #ccd4df;
      font-size: 15px;
    }

    button {
      border: none;
      background: #174ea6;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #aab5c3;
      cursor: not-allowed;
    }

    .btn-stop {
      background: #c62828;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
    }

    .status {
      padding: 13px;
      margin-top: 15px;
      border-radius: 7px;
      background: #eef3f9;
      text-align: center;
    }

    .result {
      padding: 15px;
      margin-top: 15px;
      border-radius: 8px;
      background: #e8f5e9;
      color: #1b5e20;
      overflow-wrap: anywhere;
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h2>Scanner QR BPA TIK</h2>
    <p>SMP PGRI Klapanunggal</p>
  </div>

  <div class="card">

    <label for="cameraSelect">
      Pilih Kamera
    </label>

    <select id="cameraSelect">
      <option value="">Mendeteksi kamera...</option>
    </select>

    <button type="button" id="btnMulai">
      📷 Mulai Scan
    </button>

    <button type="button" id="btnBerhenti"
            class="btn-stop" disabled>
      Berhenti Scan
    </button>

    <div id="reader"></div>

    <div class="status" id="pesan">
      Scanner siap digunakan.
    </div>

    <div class="result" id="hasil">
      <strong>QR berhasil dibaca:</strong>
      <p id="kodeQR"></p>
      <p id="statusKirim"></p>
    </div>

  </div>

</div>

<script>

let scanner = null;
let kameraAktif = false;
let sedangMembaca = false;

const cameraSelect =
  document.getElementById('cameraSelect');

const btnMulai =
  document.getElementById('btnMulai');

const btnBerhenti =
  document.getElementById('btnBerhenti');

const pesan =
  document.getElementById('pesan');

const hasil =
  document.getElementById('hasil');

const kodeQR =
  document.getElementById('kodeQR');

const statusKirim =
  document.getElementById('statusKirim');

function tampilkanPesan(teks) {
  pesan.textContent = teks;
}

// Mendeteksi kamera
async function muatKamera() {

  try {

    const daftarKamera =
      await Html5Qrcode.getCameras();

    cameraSelect.innerHTML = '';

    if (!daftarKamera || daftarKamera.length === 0) {
      throw new Error('Kamera tidak ditemukan.');
    }

    daftarKamera.forEach(function(kamera, index) {

      const option = document.createElement('option');

      option.value = kamera.id;
      option.textContent =
        kamera.label || 'Kamera ' + (index + 1);

      cameraSelect.appendChild(option);

    });

    tampilkanPesan('Kamera siap digunakan.');

  } catch (error) {

    tampilkanPesan(
      'Gagal mendeteksi kamera: ' + error.message
    );

  }
}

// Mulai scanner
async function mulaiScan() {

  if (!cameraSelect.value) {
    tampilkanPesan('Pilih kamera terlebih dahulu.');
    return;
  }

  if (typeof Html5Qrcode === 'undefined') {
    tampilkanPesan('Library QR gagal dimuat.');
    return;
  }

  try {

    scanner = new Html5Qrcode('reader');

    btnMulai.disabled = true;
    cameraSelect.disabled = true;

    await scanner.start(
      cameraSelect.value,
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },

      async function(decodedText) {

        if (sedangMembaca) return;

        sedangMembaca = true;

        await hentikanScan();

        kodeQR.textContent = decodedText;
        hasil.style.display = 'block';

        // Periksa format QR BPA TIK
        if (!decodedText.startsWith('BPA-TIK|')) {

          statusKirim.textContent =
            'QR bukan kartu resmi BPA TIK.';

          tampilkanPesan('QR tidak valid.');
          return;
        }

        // Kirim hasil QR ke halaman BPA TIK
        if (window.opener && !window.opener.closed) {

          window.opener.postMessage(
            {
              type: 'BPA_TIK_QR',
              kodeQR: decodedText
            },
            '*'
          );

          statusKirim.textContent =
            'Hasil QR dikirim ke aplikasi BPA TIK.';

          tampilkanPesan(
            'QR berhasil dikirim. Silakan lihat hasil di aplikasi BPA TIK.'
          );

        } else {

          statusKirim.textContent =
            'Halaman BPA TIK tidak terhubung.';

          tampilkanPesan(
            'Aplikasi BPA TIK tidak ditemukan. Buka scanner dari aplikasi BPA TIK.'
          );

        }

      },

      function(errorMessage) {
        // Mengabaikan kegagalan pembacaan sementara
      }

    );

    kameraAktif = true;
    btnBerhenti.disabled = false;

    tampilkanPesan(
      'Kamera aktif. Arahkan QR kartu siswa ke kamera.'
    );

  } catch (error) {

    scanner = null;
    kameraAktif = false;

    btnMulai.disabled = false;
    cameraSelect.disabled = false;

    tampilkanPesan(
      'Gagal mengaktifkan kamera: ' + error.message
    );

  }
}

// Menghentikan scanner
async function hentikanScan() {

  if (scanner && kameraAktif) {

    try {
      await scanner.stop();
      await scanner.clear();
    } catch (error) {
      console.log(error);
    }

  }

  scanner = null;
  kameraAktif = false;

  btnMulai.disabled = false;
  btnBerhenti.disabled = true;
  cameraSelect.disabled = false;

}

// Tombol
btnMulai.addEventListener('click', mulaiScan);

btnBerhenti.addEventListener('click', async function() {

  await hentikanScan();

  sedangMembaca = false;

  tampilkanPesan('Scanner dihentikan.');

});

// Deteksi kamera saat halaman dibuka
muatKamera();

</script>

</body>
</html>
